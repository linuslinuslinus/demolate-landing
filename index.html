<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Demolate Records">
  <meta property="og:title" content="Demolate Records">
  <meta property="og:description" content="DMLT001 — 05.06.2026">
  <meta property="og:image" content="/assets/demolate-logo.svg">
  <title>Demolate Records</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Archivo Black', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      overscroll-behavior: none;
      cursor: grab;
    }
    body.grabbing { cursor: grabbing; }
    body::-webkit-scrollbar { display: none; }

    canvas#stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      opacity: 0;
      animation: enter 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    @keyframes enter { to { opacity: 1; } }

    .meta {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      animation: fade-in 1.5s ease-out 1.5s forwards;
      font-family: 'Archivo Black', monospace;
      z-index: 10;
    }
    .meta--left { left: 1.5rem; }
    .meta--right { right: 1.5rem; display: flex; gap: 1rem; }
    .meta a { color: #fff; text-decoration: none; }
    .meta a:hover { background: #fff; color: #000; }
    @keyframes fade-in { to { opacity: 1; } }

    @media (max-width: 640px) {
      .meta { font-size: 0.65rem; bottom: 1rem; }
      .meta--left { left: 1rem; }
      .meta--right { right: 1rem; gap: 0.75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html, body { cursor: default; }
    }

    noscript .fallback-logo {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    noscript .fallback-logo img { width: min(58vw, 58vh); }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="meta meta--left">DMLT001 · 05.06.2026</div>
  <div class="meta meta--right">
    <a href="#" aria-label="Instagram">IG</a>
    <a href="#" aria-label="Bandcamp">BC</a>
    <a href="#" aria-label="SoundCloud">SC</a>
  </div>

  <noscript>
    <div class="fallback-logo">
      <img src="assets/demolate-logo.svg" alt="Demolate Records logo" style="width: min(58vw, 58vh); filter: invert(1);">
    </div>
  </noscript>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const canvas = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 1);

    const scene = new THREE.Scene();

    // PMREM-encoded environment for proper metallic reflections.
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
    camera.position.set(0, 0, 1200);

    // Lighting — KEEP THIS WORKING. Don't dial ambient below 0.4 or the surface
    // goes black on dark background.
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(400, 600, 800);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.55);
    fillLight.position.set(-500, -300, 400);
    scene.add(fillLight);

    // -- Aged metal texture (ref2-dominant: dark charcoal with subtle warm hints + ref3 scratches) --
    // Dominant aesthetic: dark forged steel that's been worked & weathered. Only
    // small, low-saturation warm tints (not orange rust). Fine random scratches.
    // Approach:
    //   - LOW-coverage rust mask (~15% area, soft alpha tint rather than full replace)
    //   - Two noise fields: macro for warm patches, fine for micro grain
    //   - Scratch overlay drawn as low-contrast vector strokes on the albedo canvas
    //   - Roughness: mostly mid (0.65-0.78) with slight cloudy variation
    //   - Normal map driven by fine-grain noise + faint rust bumps
    const TEX_SIZE = 1024;

    function valueNoise2D(size, octaves = 5, scaleStart = 8) {
      const result = new Float32Array(size * size);
      let amp = 1, totalAmp = 0;
      let scaleBase = scaleStart;
      for (let o = 0; o < octaves; o++) {
        totalAmp += amp;
        const cells = Math.ceil(size / scaleBase);
        const cw = cells + 1;
        const cellVals = new Float32Array(cw * cw);
        for (let i = 0; i < cellVals.length; i++) cellVals[i] = Math.random();
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const fx = x / scaleBase, fy = y / scaleBase;
            const ix = Math.floor(fx), iy = Math.floor(fy);
            const tx = fx - ix, ty = fy - iy;
            const a = cellVals[iy * cw + ix];
            const b = cellVals[iy * cw + ix + 1];
            const c = cellVals[(iy + 1) * cw + ix];
            const d = cellVals[(iy + 1) * cw + ix + 1];
            const sx = tx * tx * (3 - 2 * tx);
            const sy = ty * ty * (3 - 2 * ty);
            const top = a * (1 - sx) + b * sx;
            const bot = c * (1 - sx) + d * sx;
            result[y * size + x] += amp * (top * (1 - sy) + bot * sy);
          }
        }
        amp *= 0.55;
        scaleBase = Math.max(2, Math.floor(scaleBase * 0.5));
      }
      for (let i = 0; i < result.length; i++) result[i] /= totalAmp;
      return result;
    }

    // Macro patches noise (large warm clouds — start with big cells so the
    // logo shows distinct broad patches rather than uniform speckle).
    const rustNoise = valueNoise2D(TEX_SIZE, 4, 64);
    // Big cloudy wear field — broad light/dark areas like ref2's mottling.
    const cloudNoise = valueNoise2D(TEX_SIZE, 5, 160);
    // Mid-scale blotch noise — for ref2's irregular dark/light splotches.
    const blotchNoise = valueNoise2D(TEX_SIZE, 3, 32);
    // Fine micro-grain for surface variation (close-up character).
    const fineNoise = valueNoise2D(TEX_SIZE, 3, 4);

    // RUST MASK — soft threshold: top ~30% of noise produces warm tint.
    const rustMask = new Float32Array(TEX_SIZE * TEX_SIZE);
    for (let i = 0; i < rustMask.length; i++) {
      let v = (rustNoise[i] - 0.52) * 2.6;
      v = Math.min(1, Math.max(0, v));
      v = v * v * (3 - 2 * v);
      rustMask[i] = v;
    }

    // ALBEDO: dark charcoal iron with cloudy wear and very subtle warm hint patches.
    const colorCanvas = document.createElement('canvas');
    colorCanvas.width = colorCanvas.height = TEX_SIZE;
    const actx = colorCanvas.getContext('2d');
    const aimg = actx.createImageData(TEX_SIZE, TEX_SIZE);
    for (let i = 0; i < rustMask.length; i++) {
      const m = rustMask[i];
      const cloud = cloudNoise[i];   // 0..1 broad cloudy wear field
      const blotch = blotchNoise[i]; // 0..1 mid-scale splotches
      const fine = fineNoise[i];     // 0..1 fine grain field

      // Base iron — dark charcoal with strong cloudy mottling. Ref2 has a wide
      // tonal range from near-black recesses to almost-bright highlights.
      // Combine broad clouds with mid blotches for ref2's organic patchy look.
      let c = (cloud - 0.5) * 2;             // -1..1 broad
      const bl = (blotch - 0.5) * 2;         // -1..1 mid
      // Asymmetric S-curve: stretches midtones, keeps deep darks/bright peaks.
      let mottle = c * 0.7 + bl * 0.4;
      mottle = Math.tanh(mottle * 1.4);      // -1..1 with softer ends
      const shift = mottle * 26;             // narrower tonal band — ref2 is uniformly mid-dark
      let r = 70 + shift;
      let g = 72 + shift;
      let b = 76 + shift;

      // Warm hint patches — subtle brown-stain tint, never pure orange.
      // Just nudges hue toward warm in the rust mask areas.
      if (m > 0) {
        let rR, rG, rB;
        if (m < 0.55) {
          // Faint stain
          const t = m / 0.55;
          rR = 95 + t * 25;   // 95 → 120
          rG = 78 + t * 10;   // 78 → 88
          rB = 66 + t * 0;    // 66 → 66
        } else {
          // Stronger stain (still muted)
          const t = (m - 0.55) / 0.45;
          rR = 120 - t * 22;  // 120 → 98
          rG = 88 - t * 22;   // 88 → 66
          rB = 66 - t * 18;   // 66 → 48
        }
        // SOFT alpha blend — tint, not replace (brief: max 10%).
        const alpha = m * 0.10;
        r = r * (1 - alpha) + rR * alpha;
        g = g * (1 - alpha) + rG * alpha;
        b = b * (1 - alpha) + rB * alpha;
      }

      // Fine micro-grain modulation (helps with the photographic feel)
      const fineShift = (fine - 0.5) * 4;
      r += fineShift;
      g += fineShift;
      b += fineShift;

      // Per-pixel pepper grain (kept low so it doesn't look like sandpaper)
      const grain = (Math.random() - 0.5) * 3;
      const px = i * 4;
      aimg.data[px]     = Math.max(0, Math.min(255, r + grain));
      aimg.data[px + 1] = Math.max(0, Math.min(255, g + grain));
      aimg.data[px + 2] = Math.max(0, Math.min(255, b + grain));
      aimg.data[px + 3] = 255;
    }
    actx.putImageData(aimg, 0, 0);

    // FINE SCRATCH OVERLAY — VERY sparse. Ref2 has no obvious scratches; we add
    // only a few faint hairlines to suggest tool-mark character up close,
    // staying well below the threshold that would make it look like ref3.
    actx.save();
    const NUM_SCRATCHES = 90;
    for (let s = 0; s < NUM_SCRATCHES; s++) {
      const x0 = Math.random() * TEX_SIZE;
      const y0 = Math.random() * TEX_SIZE;
      const baseAngle = (Math.random() < 0.5) ? 0.25 : -0.35;
      const ang = baseAngle + (Math.random() - 0.5) * 1.2;
      const len = 30 + Math.random() * Math.random() * 220;
      const x1 = x0 + Math.cos(ang) * len;
      const y1 = y0 + Math.sin(ang) * len;
      const bright = Math.random() < 0.5;
      const a = 0.04 + Math.random() * 0.06;
      actx.globalCompositeOperation = bright ? 'lighter' : 'multiply';
      actx.strokeStyle = bright
        ? `rgba(190, 195, 200, ${a})`
        : `rgba(14, 16, 20, ${a + 0.04})`;
      actx.lineWidth = 0.5 + Math.random() * 0.8;
      actx.beginPath();
      actx.moveTo(x0, y0);
      const mx = (x0 + x1) / 2 + (Math.random() - 0.5) * 8;
      const my = (y0 + y1) / 2 + (Math.random() - 0.5) * 8;
      actx.quadraticCurveTo(mx, my, x1, y1);
      actx.stroke();
    }
    // Dark pits — ref2 has scattered tiny dark spots.
    actx.globalCompositeOperation = 'multiply';
    for (let p = 0; p < 350; p++) {
      const x = Math.random() * TEX_SIZE;
      const y = Math.random() * TEX_SIZE;
      const r = 0.4 + Math.random() * 1.6;
      actx.fillStyle = `rgba(15, 17, 20, ${0.18 + Math.random() * 0.28})`;
      actx.beginPath();
      actx.arc(x, y, r, 0, Math.PI * 2);
      actx.fill();
    }
    // A few larger soft dark blotches like ref2's deeper recesses.
    actx.globalCompositeOperation = 'multiply';
    for (let p = 0; p < 18; p++) {
      const x = Math.random() * TEX_SIZE;
      const y = Math.random() * TEX_SIZE;
      const radius = 40 + Math.random() * 90;
      const grad = actx.createRadialGradient(x, y, 0, x, y, radius);
      grad.addColorStop(0, `rgba(40, 42, 46, ${0.45 + Math.random() * 0.2})`);
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      actx.fillStyle = grad;
      actx.beginPath();
      actx.arc(x, y, radius, 0, Math.PI * 2);
      actx.fill();
    }
    // A few soft warm-brown wash blotches (ref2 has these scattered).
    actx.globalCompositeOperation = 'multiply';
    for (let p = 0; p < 14; p++) {
      const x = Math.random() * TEX_SIZE;
      const y = Math.random() * TEX_SIZE;
      const radius = 50 + Math.random() * 110;
      const grad = actx.createRadialGradient(x, y, 0, x, y, radius);
      grad.addColorStop(0, `rgba(110, 92, 78, ${0.18 + Math.random() * 0.12})`);
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      actx.fillStyle = grad;
      actx.beginPath();
      actx.arc(x, y, radius, 0, Math.PI * 2);
      actx.fill();
    }
    actx.restore();

    // ROUGHNESS: mostly mid (worn metal sheen — not chalky, not mirror).
    // Lower base so the surface catches some specular highlights.
    const weatheredCanvas = document.createElement('canvas');
    weatheredCanvas.width = weatheredCanvas.height = TEX_SIZE;
    const rctx = weatheredCanvas.getContext('2d');
    const rimg = rctx.createImageData(TEX_SIZE, TEX_SIZE);
    for (let i = 0; i < rustMask.length; i++) {
      let rough = 0.56
                + 0.07 * rustMask[i]            // rust → rougher
                + (cloudNoise[i] - 0.5) * 0.07  // cloud variation: light spots = smoother
                + (fineNoise[i] - 0.5) * 0.03;  // fine variation
      rough += (Math.random() - 0.5) * 0.02;
      rough = Math.min(1, Math.max(0, rough));
      const px = i * 4;
      const v = rough * 255;
      rimg.data[px] = v;
      rimg.data[px + 1] = v;
      rimg.data[px + 2] = v;
      rimg.data[px + 3] = 255;
    }
    rctx.putImageData(rimg, 0, 0);

    // HEIGHTS for normal map: gentle surface variation (avoid stoney feel).
    const heights = new Float32Array(TEX_SIZE * TEX_SIZE);
    for (let i = 0; i < rustMask.length; i++) {
      heights[i] = Math.min(1, Math.max(0,
          fineNoise[i] * 0.08
          + rustMask[i] * 0.20
          + Math.random() * 0.04
          + 0.15));
    }

    // Sobel-derived normal map from heightmap
    const normalCanvas = document.createElement('canvas');
    normalCanvas.width = normalCanvas.height = TEX_SIZE;
    const nctx = normalCanvas.getContext('2d');
    const nimg = nctx.createImageData(TEX_SIZE, TEX_SIZE);
    const at = (x, y) => heights[((y+TEX_SIZE)%TEX_SIZE)*TEX_SIZE + ((x+TEX_SIZE)%TEX_SIZE)] * 255;
    for (let y = 0; y < TEX_SIZE; y++) {
      for (let x = 0; x < TEX_SIZE; x++) {
        const dx = (at(x+1,y-1)+2*at(x+1,y)+at(x+1,y+1)) - (at(x-1,y-1)+2*at(x-1,y)+at(x-1,y+1));
        const dy = (at(x-1,y+1)+2*at(x,y+1)+at(x+1,y+1)) - (at(x-1,y-1)+2*at(x,y-1)+at(x+1,y-1));
        const dz = 100;
        const len = Math.hypot(dx, dy, dz) || 1;
        const i = (y*TEX_SIZE+x)*4;
        nimg.data[i] = ((dx/len)*0.5+0.5)*255;
        nimg.data[i+1] = ((dy/len)*0.5+0.5)*255;
        nimg.data[i+2] = ((dz/len)*0.5+0.5)*255;
        nimg.data[i+3] = 255;
      }
    }
    nctx.putImageData(nimg, 0, 0);

    // ExtrudeGeometry UVs are in shape coords (~0..1003), not normalized.
    // 1.0 tile across the logo = no visible repetition (the seams are hidden
    // behind the logo's edges).
    const TILES = 1.0;
    const REPEAT_X = TILES / 1003;
    const REPEAT_Y = TILES / 471 * (471 / 1003);  // keep square-ish tiles given aspect

    const roughnessTex = new THREE.CanvasTexture(weatheredCanvas);
    roughnessTex.wrapS = roughnessTex.wrapT = THREE.RepeatWrapping;
    roughnessTex.repeat.set(REPEAT_X, REPEAT_Y);
    roughnessTex.colorSpace = THREE.NoColorSpace;

    const normalTex = new THREE.CanvasTexture(normalCanvas);
    normalTex.wrapS = normalTex.wrapT = THREE.RepeatWrapping;
    normalTex.repeat.set(REPEAT_X, REPEAT_Y);
    normalTex.colorSpace = THREE.NoColorSpace;

    const colorTex = new THREE.CanvasTexture(colorCanvas);
    colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;
    colorTex.repeat.set(REPEAT_X, REPEAT_Y);
    colorTex.colorSpace = THREE.SRGBColorSpace;

    // Aged forged steel: base white so the albedo's charcoal + warm hints render true.
    // metalness slightly lower so the surface reads as worked/oxidized steel
    // rather than pristine mirror metal.
    const material = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      map: colorTex,
      metalness: 0.85,
      roughness: 1.0,              // multiplied by roughnessMap
      roughnessMap: roughnessTex,
      normalMap: normalTex,
      normalScale: new THREE.Vector2(0.18, 0.18),
      envMapIntensity: 0.95,
    });

    const innerGroup = new THREE.Group();
    const logoGroup = new THREE.Group();
    logoGroup.add(innerGroup);

    const loader = new SVGLoader();
    const data = loader.parse(`<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1003.09 470.89">
<path d="m459.39,47.59C432.21,19.64,394.56,1.93,352.73.76c-2.86-.05-5.78.58-8.4,1.75L11.79,150.46c-7.13,3.2-11.79,10.34-11.79,18.2v134.37c0,7.81,4.66,14.94,11.79,18.14l332.54,147.96c2.62,1.21,5.54,1.84,8.4,1.75,83.61-2.33,150.62-70.8,150.62-154.95v-160.18c0-42.07-16.74-80.26-43.96-108.16Zm-111.03,210.31c0,32.07-25.96,58.03-58.03,58.03h-115.45c-10.96,0-19.84-8.92-19.84-19.89v-120.44c0-10.97,8.88-19.85,19.84-19.85h116.71c31.34,0,56.77,25.38,56.77,56.73v45.42Z"/>
<path d="m998.85,328.79l-311.97,138.79c-3.69,1.65-7.67,2.52-11.75,2.52h-6.69c-78.52,0-142.18-63.67-142.18-142.18v-176.54C526.26,70.1,590.21,3.82,670.57.03c4.47-.19,8.98.63,13.06,2.43l314.88,138.73c7.08,3.11,4.85,13.69-2.91,13.69h-272.04c-23.34,0-42.26,18.92-42.26,42.31v75.6c0,23.35,18.92,42.27,42.26,42.27h272.38c7.71,0,9.94,10.58,2.91,13.73Z"/>
</svg>`);

    // Softer bevel — bigger size + more segments creates a chamfered edge that
    // catches light like a real machined part instead of a CGI box.
    const extrudeSettings = {
      depth: 110,
      bevelEnabled: true,
      bevelSegments: 6,
      bevelSize: 5,
      bevelThickness: 5,
      curveSegments: 28,
    };

    data.paths.forEach((path) => {
      SVGLoader.createShapes(path).forEach((shape) => {
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.computeVertexNormals();
        innerGroup.add(new THREE.Mesh(geometry, material));
      });
    });

    innerGroup.rotation.x = Math.PI;
    logoGroup.updateMatrixWorld(true);
    const bbox = new THREE.Box3().setFromObject(logoGroup);
    const center = new THREE.Vector3();
    bbox.getCenter(center);
    innerGroup.position.sub(center);
    scene.add(logoGroup);

    console.log('[demolate] paths:', data.paths.length, 'meshes:', innerGroup.children.length);

    // Post-processing
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.1,   // strength — minimal
      0.6,   // radius
      0.92   // threshold — only brightest highlights
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // Wheel + drag-driven endless rotation (no scrolling)
    let targetRot = 0;
    let currentRot = 0;
    const WHEEL_SENSITIVITY = 0.003;
    const DRAG_SENSITIVITY = 0.008;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetRot += e.deltaY * WHEEL_SENSITIVITY;
    }, { passive: false });

    let dragging = false;
    let dragStartX = 0;
    let dragStartRot = 0;
    function startDrag(x) {
      dragging = true;
      dragStartX = x;
      dragStartRot = targetRot;
      document.body.classList.add('grabbing');
    }
    function moveDrag(x) {
      if (!dragging) return;
      targetRot = dragStartRot + (x - dragStartX) * DRAG_SENSITIVITY;
    }
    function endDrag() {
      dragging = false;
      document.body.classList.remove('grabbing');
    }
    canvas.addEventListener('mousedown', (e) => startDrag(e.clientX));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchend', endDrag);

    // Mouse parallax (subtle scene tilt)
    let parallaxX = 0, parallaxY = 0;
    let parallaxTargetX = 0, parallaxTargetY = 0;
    window.addEventListener('mousemove', (e) => {
      if (dragging) return;
      parallaxTargetX = (e.clientX / window.innerWidth - 0.5) * 2;
      parallaxTargetY = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      const fovRad = camera.fov * Math.PI / 180;
      const visibleHeight = 2 * Math.tan(fovRad / 2) * camera.position.z;
      const visibleWidth = visibleHeight * camera.aspect;
      const target = Math.min(visibleWidth, visibleHeight) * 0.58;
      const bboxSize = bbox.getSize(new THREE.Vector3());
      const scale = Math.min(target / bboxSize.x, target / bboxSize.y);
      logoGroup.scale.setScalar(scale);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    function animate() {
      currentRot += (targetRot - currentRot) * 0.12;
      logoGroup.rotation.y = prefersReducedMotion ? 0 : currentRot;

      parallaxX += (parallaxTargetX - parallaxX) * 0.05;
      parallaxY += (parallaxTargetY - parallaxY) * 0.05;
      if (!prefersReducedMotion) {
        logoGroup.rotation.x = parallaxY * 0.1;
      }

      composer.render();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
