  <title>Demolate Records</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Archivo Black', system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo {
      width: min(58vw, 58vh);
      height: auto;
      fill: #fff;
      opacity: 0;
      transform: scale(0.96);
      animation:
        enter 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards,
        breathe 9s ease-in-out 2.6s infinite alternate;
    }

    @keyframes enter {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes breathe {
      from { transform: scale(1); }
      to   { transform: scale(1.014); }
    }

    .meta {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      animation: fade-in 1.5s ease-out 1.5s forwards;
      font-family: 'Archivo Black', monospace;
    }

    .meta--left {
      left: 1.5rem;
    }

    .meta--right {
      right: 1.5rem;
      display: flex;
      gap: 1rem;
    }

    .meta a {
      color: #fff;
      text-decoration: none;
    }

    .meta a:hover {
      color: #fff;
      background: #fff;
      color: #000;
    }

    @keyframes fade-in {
      to { opacity: 1; }
    }

    @media (max-width: 640px) {
      .logo { width: 78vw; }
      .meta { font-size: 0.65rem; bottom: 1rem; }
      .meta--left { left: 1rem; }
      .meta--right { right: 1rem; gap: 0.75rem; }
    }

    /* Respect users who prefer no motion */
    @media (prefers-reduced-motion: reduce) {
      .logo,
      .meta {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
