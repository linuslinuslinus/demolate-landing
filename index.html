<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Demolate Records">
  <meta property="og:title" content="Demolate Records">
  <meta property="og:description" content="DMLT001 — 05.06.2026">
  <meta property="og:image" content="/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/assets/demolate-logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="apple-touch-icon" sizes="256x256" href="/assets/favicon-256.png">
  <title>Demolate Records</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Archivo Black', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      overscroll-behavior: none;
      cursor: grab;
    }
    body.grabbing { cursor: grabbing; }
    body::-webkit-scrollbar { display: none; }

    canvas#stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      opacity: 0;
      animation: enter 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    @keyframes enter { to { opacity: 1; } }

    .meta {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      animation: fade-in 1.5s ease-out 1.5s forwards;
      font-family: 'Archivo Black', monospace;
      z-index: 10;
    }
    .meta--left { left: 1.5rem; }
    .meta--right { right: 1.5rem; display: flex; gap: 1rem; }
    .meta a { color: #fff; text-decoration: none; }
    .meta a:hover { background: #fff; color: #000; }
    @keyframes fade-in { to { opacity: 1; } }

    @media (max-width: 640px) {
      .meta { font-size: 0.65rem; bottom: 1rem; }
      .meta--left { left: 1rem; }
      .meta--right { right: 1rem; gap: 0.75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html, body { cursor: default; }
    }

    noscript .fallback-logo {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    noscript .fallback-logo img { width: min(58vw, 58vh); }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="meta meta--left">DMLT001 · 05.06.2026</div>
  <div class="meta meta--right">
    <a href="https://www.instagram.com/demolate.records/" target="_blank" rel="noopener" aria-label="Instagram">IG</a>
    <a href="https://demolaterecords.bandcamp.com/" target="_blank" rel="noopener" aria-label="Bandcamp">BC</a>
    <a href="https://soundcloud.com/demolate_records" target="_blank" rel="noopener" aria-label="SoundCloud">SC</a>
  </div>

  <noscript>
    <div class="fallback-logo">
      <img src="assets/demolate-logo.svg" alt="Demolate Records logo" style="width: min(58vw, 58vh); filter: invert(1);">
    </div>
  </noscript>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    const canvas = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 1);

    const scene = new THREE.Scene();

    // PMREM-encoded environment for proper metallic reflections.
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
    camera.position.set(0, 0, 1200);

    // Lighting — KEEP THIS WORKING. Don't dial ambient below 0.4 or the surface
    // goes black on dark background.
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(400, 600, 800);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.55);
    fillLight.position.set(-500, -300, 400);
    scene.add(fillLight);

    // -- Real PBR textures from PolyHaven (CC0 license) --
    // We use blue_metal_plate's SURFACE maps (normal, roughness, AO) for the
    // scuffed/scratched character without rust, then DROP its diffuse map and
    // tint the material with a neutral steel gray. Result: clean aged metal
    // with surface character, no rust, no blue.
    const PH_BASE = 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/blue_metal_plate';
    const PH_SLUG = 'blue_metal_plate';

    const texLoader = new THREE.TextureLoader();
    texLoader.crossOrigin = 'anonymous';

    function loadPhTex(map, colorSpace) {
      const tex = texLoader.load(`${PH_BASE}/${PH_SLUG}_${map}_1k.jpg`);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = colorSpace;
      return tex;
    }

    const normalTex = loadPhTex('nor_gl', THREE.NoColorSpace);
    const roughnessTex = loadPhTex('rough', THREE.NoColorSpace);
    const aoTex = loadPhTex('ao', THREE.NoColorSpace);
    // intentionally NO diffuse — we want flat gray, not painted blue

    // ExtrudeGeometry UVs are in shape coords (~0..1003, not normalized).
    // 1.0 tile across the logo width hides texture seams behind the edges.
    const TILES = 1.0;
    const REPEAT_X = TILES / 1003;
    const REPEAT_Y = TILES / 1003;
    [normalTex, roughnessTex, aoTex].forEach(t => {
      t.repeat.set(REPEAT_X, REPEAT_Y);
    });

    // Clean aged steel — flat gray with the texture's scratch/scuff character.
    const material = new THREE.MeshPhysicalMaterial({
      color: 0x9aa0a4,            // neutral steel gray
      metalness: 0.95,
      roughness: 1.0,              // multiplied by roughnessMap
      roughnessMap: roughnessTex,
      normalMap: normalTex,
      normalScale: new THREE.Vector2(0.6, 0.6),
      aoMap: aoTex,
      aoMapIntensity: 0.9,
      envMapIntensity: 1.2,
    });

    // Three-level group hierarchy:
    //   parallaxGroup → handles mouse-parallax tilt (rotation.x + rotation.y)
    //     └── logoGroup → handles scroll-driven spin (rotation.y)
    //           └── innerGroup → SVG Y-flip + meshes
    // This separation lets us apply parallax-Y rotation (left-right tilt)
    // WITHOUT clashing with the spin's rotation.y.
    const innerGroup = new THREE.Group();
    const logoGroup = new THREE.Group();
    const parallaxGroup = new THREE.Group();
    parallaxGroup.add(logoGroup);
    logoGroup.add(innerGroup);

    const loader = new SVGLoader();
    const data = loader.parse(`<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1003.09 470.89">
<path d="m459.39,47.59C432.21,19.64,394.56,1.93,352.73.76c-2.86-.05-5.78.58-8.4,1.75L11.79,150.46c-7.13,3.2-11.79,10.34-11.79,18.2v134.37c0,7.81,4.66,14.94,11.79,18.14l332.54,147.96c2.62,1.21,5.54,1.84,8.4,1.75,83.61-2.33,150.62-70.8,150.62-154.95v-160.18c0-42.07-16.74-80.26-43.96-108.16Zm-111.03,210.31c0,32.07-25.96,58.03-58.03,58.03h-115.45c-10.96,0-19.84-8.92-19.84-19.89v-120.44c0-10.97,8.88-19.85,19.84-19.85h116.71c31.34,0,56.77,25.38,56.77,56.73v45.42Z"/>
<path d="m998.85,328.79l-311.97,138.79c-3.69,1.65-7.67,2.52-11.75,2.52h-6.69c-78.52,0-142.18-63.67-142.18-142.18v-176.54C526.26,70.1,590.21,3.82,670.57.03c4.47-.19,8.98.63,13.06,2.43l314.88,138.73c7.08,3.11,4.85,13.69-2.91,13.69h-272.04c-23.34,0-42.26,18.92-42.26,42.31v75.6c0,23.35,18.92,42.27,42.26,42.27h272.38c7.71,0,9.94,10.58,2.91,13.73Z"/>
</svg>`);

    // Softer bevel — bigger size + more segments creates a chamfered edge that
    // catches light like a real machined part instead of a CGI box.
    const extrudeSettings = {
      depth: 110,
      bevelEnabled: true,
      bevelSegments: 6,
      bevelSize: 5,
      bevelThickness: 5,
      curveSegments: 28,
    };

    data.paths.forEach((path) => {
      SVGLoader.createShapes(path).forEach((shape) => {
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.computeVertexNormals();
        innerGroup.add(new THREE.Mesh(geometry, material));
      });
    });

    innerGroup.rotation.x = Math.PI;
    logoGroup.updateMatrixWorld(true);
    const bbox = new THREE.Box3().setFromObject(logoGroup);
    const center = new THREE.Vector3();
    bbox.getCenter(center);
    innerGroup.position.sub(center);
    scene.add(parallaxGroup);

    console.log('[demolate] paths:', data.paths.length, 'meshes:', innerGroup.children.length);

    // -- Material switcher (M key cycles materials) --
    // Three preset looks: aged steel (default), polished silver, copper/bronze.
    // Smooth tween between them over ~0.6s when M is pressed.
    const MATERIAL_PRESETS = [
      { name: 'aged-steel',    color: 0x9aa0a4, metalness: 0.95, roughness: 1.0,  normalScale: 0.6, envMapIntensity: 1.2 },
      { name: 'polished',      color: 0xd2d5d8, metalness: 1.0,  roughness: 0.55, normalScale: 0.3, envMapIntensity: 1.8 },
      { name: 'copper-bronze', color: 0xb47238, metalness: 1.0,  roughness: 0.85, normalScale: 0.7, envMapIntensity: 1.4 },
      { name: 'black-metal',   color: 0x383a3c, metalness: 1.0,  roughness: 0.6,  normalScale: 0.55, envMapIntensity: 1.1 },
    ];
    let presetIdx = 0;
    let tweenT0 = 0, tweenDur = 600;
    let tweenFrom = null, tweenTo = null;

    function cyclePreset() {
      presetIdx = (presetIdx + 1) % MATERIAL_PRESETS.length;
      tweenFrom = {
        color: material.color.clone(),
        metalness: material.metalness,
        roughness: material.roughness,
        normalScaleX: material.normalScale.x,
        envMapIntensity: material.envMapIntensity,
      };
      const next = MATERIAL_PRESETS[presetIdx];
      tweenTo = {
        color: new THREE.Color(next.color),
        metalness: next.metalness,
        roughness: next.roughness,
        normalScaleX: next.normalScale,
        envMapIntensity: next.envMapIntensity,
      };
      tweenT0 = performance.now();
    }
    window.addEventListener('keydown', (e) => {
      if (e.key === 'm' || e.key === 'M') cyclePreset();
    });

    // -- Crack animation --
    // Procedurally drawn jagged crack with branches (looks like real glass/metal
    // fracture, not a 2D line). Drawn into a canvas using recursive midpoint
    // displacement, used as alphaMap on a transparent plane parented to the
    // logo. Visible 5s at full opacity, then fades over 2s. New crack texture
    // generated each cycle so it's never the same shape twice.
    const CRACK_TEX_W = 1024;
    const CRACK_TEX_H = 512;

    function generateCrackCanvas() {
      const c = document.createElement('canvas');
      c.width = CRACK_TEX_W;
      c.height = CRACK_TEX_H;
      const ctx = c.getContext('2d');
      // Black background so the alphaMap shows the crack as opaque
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CRACK_TEX_W, CRACK_TEX_H);

      ctx.lineCap = 'round';
      ctx.strokeStyle = '#fff';   // white = visible in alphaMap

      function drawJaggedLine(x0, y0, x1, y1, width, depth, branchProb) {
        if (depth <= 0 || (Math.abs(x1-x0) < 6 && Math.abs(y1-y0) < 6)) {
          ctx.lineWidth = Math.max(0.5, width);
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(x1, y1);
          ctx.stroke();
          return;
        }
        // Midpoint displacement perpendicular to segment direction
        const dx = x1 - x0, dy = y1 - y0;
        const len = Math.hypot(dx, dy);
        const nx = -dy / len, ny = dx / len;   // unit normal
        const offset = (Math.random() - 0.5) * len * 0.18;
        const mx = (x0 + x1) / 2 + nx * offset;
        const my = (y0 + y1) / 2 + ny * offset;
        drawJaggedLine(x0, y0, mx, my, width, depth - 1, branchProb);
        drawJaggedLine(mx, my, x1, y1, width * 0.95, depth - 1, branchProb);
        // Random branch
        if (Math.random() < branchProb && depth > 2) {
          const angle = Math.atan2(ny, nx) + (Math.random() - 0.5) * 1.2;
          const bLen = len * (0.25 + Math.random() * 0.35);
          const bx = mx + Math.cos(angle) * bLen;
          const by = my + Math.sin(angle) * bLen;
          drawJaggedLine(mx, my, bx, by, width * 0.55, depth - 2, branchProb * 0.5);
        }
      }

      // Main crack across the canvas, slight angle
      const angle = (Math.random() - 0.5) * 0.4;
      const cy = CRACK_TEX_H / 2 + (Math.random() - 0.5) * CRACK_TEX_H * 0.3;
      const startX = 50;
      const startY = cy - Math.tan(angle) * (CRACK_TEX_W / 2 - 50);
      const endX = CRACK_TEX_W - 50;
      const endY = cy + Math.tan(angle) * (CRACK_TEX_W / 2 - 50);
      drawJaggedLine(startX, startY, endX, endY, 5, 7, 0.45);

      // Slight highlight along one edge — gives the crack visual depth
      // (suggests a 3D chip catching light on its facet)
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1;
      drawJaggedLine(startX + 2, startY - 1, endX + 2, endY - 1, 1, 6, 0.2);

      return c;
    }

    const crackGeo = new THREE.PlaneGeometry(1200, 600);
    const crackMat = new THREE.MeshBasicMaterial({
      color: 0x080808,           // very dark — reads as crevice shadow
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false,
      alphaMap: new THREE.CanvasTexture(generateCrackCanvas()),
    });
    const crackMesh = new THREE.Mesh(crackGeo, crackMat);
    crackMesh.renderOrder = 999;
    crackMesh.position.set(0, 0, 80);
    logoGroup.add(crackMesh);

    let crackState = 'idle';
    let crackT0 = 0;
    let nextCrackAt = performance.now() + 6000 + Math.random() * 4000;

    // -- Ambient particles (atmospheric drift) --
    // 80 tiny white dots drifting slowly in the scene. Adds atmosphere
    // without competing with the logo for attention.
    const PARTICLE_COUNT = 80;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      // Spread across a volume in front of and behind the logo
      positions[i * 3]     = (Math.random() - 0.5) * 1600;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 900;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 400 - 100;
      // Very slow random velocity
      velocities[i * 3]     = (Math.random() - 0.5) * 0.25;
      velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.25;
      velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.10;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 2.5,
      transparent: true,
      opacity: 0.35,
      sizeAttenuation: true,
      depthWrite: false,
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Post-processing
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.1,   // strength — minimal
      0.6,   // radius
      0.92   // threshold — only brightest highlights
    );
    composer.addPass(bloomPass);

    // Chromatic aberration pass — intensity scales with rotation velocity.
    // R sampled with +offset, B with -offset, G centered. Subtle at rest,
    // visible during fast spin.
    const caPass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        amount: { value: 0.0 },  // updated each frame from rotation velocity
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float amount;
        varying vec2 vUv;
        void main() {
          // Direction radially outward from center (subtle)
          vec2 dir = (vUv - 0.5) * amount;
          float r = texture2D(tDiffuse, vUv + dir).r;
          float g = texture2D(tDiffuse, vUv).g;
          float b = texture2D(tDiffuse, vUv - dir).b;
          float a = texture2D(tDiffuse, vUv).a;
          gl_FragColor = vec4(r, g, b, a);
        }
      `,
    });
    composer.addPass(caPass);

    composer.addPass(new OutputPass());

    // Wheel + drag-driven endless rotation (no scrolling)
    let targetRot = 0;
    let currentRot = 0;
    const WHEEL_SENSITIVITY = 0.003;
    const DRAG_SENSITIVITY = 0.008;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetRot += e.deltaY * WHEEL_SENSITIVITY;
    }, { passive: false });

    let dragging = false;
    let dragStartX = 0;
    let dragStartRot = 0;
    let dragMoved = false;            // track if pointer actually moved during drag
    function startDrag(x) {
      dragging = true;
      dragMoved = false;
      dragStartX = x;
      dragStartRot = targetRot;
      document.body.classList.add('grabbing');
    }
    function moveDrag(x) {
      if (!dragging) return;
      if (Math.abs(x - dragStartX) > 5) dragMoved = true;
      targetRot = dragStartRot + (x - dragStartX) * DRAG_SENSITIVITY;
    }
    function endDrag() {
      // If we never moved more than 5px, treat as a CLICK → fast 720° auto-spin
      if (dragging && !dragMoved) {
        const start = targetRot;
        const end = targetRot + Math.PI * 4;
        const t0 = performance.now();
        const dur = 1200;
        function spin() {
          const t = (performance.now() - t0) / dur;
          if (t >= 1) { targetRot = end; return; }
          const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
          targetRot = start + (end - start) * eased;
          requestAnimationFrame(spin);
        }
        requestAnimationFrame(spin);
      }
      dragging = false;
      document.body.classList.remove('grabbing');
    }
    canvas.addEventListener('mousedown', (e) => startDrag(e.clientX));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchend', endDrag);

    // Mouse parallax (subtle scene tilt)
    let parallaxX = 0, parallaxY = 0;
    let parallaxTargetX = 0, parallaxTargetY = 0;
    window.addEventListener('mousemove', (e) => {
      if (dragging) return;
      parallaxTargetX = (e.clientX / window.innerWidth - 0.5) * 2;
      parallaxTargetY = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      const fovRad = camera.fov * Math.PI / 180;
      const visibleHeight = 2 * Math.tan(fovRad / 2) * camera.position.z;
      const visibleWidth = visibleHeight * camera.aspect;
      const target = Math.min(visibleWidth, visibleHeight) * 0.58;
      const bboxSize = bbox.getSize(new THREE.Vector3());
      const scale = Math.min(target / bboxSize.x, target / bboxSize.y);
      logoGroup.scale.setScalar(scale);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    let prevRot = 0;
    function animate() {
      const prev = currentRot;
      currentRot += (targetRot - currentRot) * 0.12;
      logoGroup.rotation.y = prefersReducedMotion ? 0 : currentRot;

      // Chromatic aberration intensity proportional to rotation velocity
      const rotVel = Math.abs(currentRot - prev);
      // Map velocity 0..0.2 rad/frame → CA amount 0..0.015
      const caAmount = Math.min(0.015, rotVel * 0.075);
      caPass.uniforms.amount.value = caAmount;

      // Material tween (M-key cycling)
      if (tweenTo && tweenFrom) {
        const t = Math.min(1, (performance.now() - tweenT0) / tweenDur);
        const k = t * t * (3 - 2 * t);  // smoothstep
        material.color.r = tweenFrom.color.r + (tweenTo.color.r - tweenFrom.color.r) * k;
        material.color.g = tweenFrom.color.g + (tweenTo.color.g - tweenFrom.color.g) * k;
        material.color.b = tweenFrom.color.b + (tweenTo.color.b - tweenFrom.color.b) * k;
        material.metalness = tweenFrom.metalness + (tweenTo.metalness - tweenFrom.metalness) * k;
        material.roughness = tweenFrom.roughness + (tweenTo.roughness - tweenFrom.roughness) * k;
        material.normalScale.set(
          tweenFrom.normalScaleX + (tweenTo.normalScaleX - tweenFrom.normalScaleX) * k,
          tweenFrom.normalScaleX + (tweenTo.normalScaleX - tweenFrom.normalScaleX) * k
        );
        material.envMapIntensity = tweenFrom.envMapIntensity + (tweenTo.envMapIntensity - tweenFrom.envMapIntensity) * k;
        if (t >= 1) { tweenFrom = null; tweenTo = null; }
      }

      // Crack animation cycle
      // Lifecycle: 0.5s fade-in → 5s hold → 2s fade-out (total ~7.5s)
      const now = performance.now();
      if (crackState === 'idle' && now >= nextCrackAt) {
        crackState = 'showing';
        crackT0 = now;
        // Generate a fresh crack texture for this cycle (never same shape twice)
        crackMat.alphaMap.image = generateCrackCanvas();
        crackMat.alphaMap.needsUpdate = true;
        // Random small rotation/position offset within the logo
        crackMesh.rotation.z = (Math.random() - 0.5) * 0.3;
        crackMesh.position.x = (Math.random() - 0.5) * 100;
        crackMesh.position.y = (Math.random() - 0.5) * 60;
      }
      if (crackState === 'showing') {
        const elapsed = (now - crackT0) / 1000;  // seconds
        const FADE_IN = 0.5, HOLD = 5.0, FADE_OUT = 2.0;
        const PEAK = 0.85;
        let opacity;
        if (elapsed < FADE_IN) {
          opacity = (elapsed / FADE_IN) * PEAK;
        } else if (elapsed < FADE_IN + HOLD) {
          opacity = PEAK;
        } else if (elapsed < FADE_IN + HOLD + FADE_OUT) {
          opacity = PEAK * (1 - (elapsed - FADE_IN - HOLD) / FADE_OUT);
        } else {
          opacity = 0;
          crackState = 'idle';
          nextCrackAt = now + 18000 + Math.random() * 15000;
        }
        crackMat.opacity = opacity;
      }

      parallaxX += (parallaxTargetX - parallaxX) * 0.05;
      parallaxY += (parallaxTargetY - parallaxY) * 0.05;
      if (!prefersReducedMotion) {
        // Apply parallax to the OUTER parallaxGroup so it doesn't conflict
        // with the spin's rotation.y on logoGroup.
        parallaxGroup.rotation.x = parallaxY * 0.12;   // mouse up/down → logo tilts up/down
        parallaxGroup.rotation.y = parallaxX * 0.18;   // mouse left/right → logo tilts left/right
      }

      // Drift particles. Wrap them around when they leave the visible volume.
      if (!prefersReducedMotion) {
        const pos = particleGeo.attributes.position.array;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          pos[i * 3]     += velocities[i * 3];
          pos[i * 3 + 1] += velocities[i * 3 + 1];
          pos[i * 3 + 2] += velocities[i * 3 + 2];
          // Wrap on X
          if (pos[i * 3] > 800) pos[i * 3] = -800;
          else if (pos[i * 3] < -800) pos[i * 3] = 800;
          // Wrap on Y
          if (pos[i * 3 + 1] > 450) pos[i * 3 + 1] = -450;
          else if (pos[i * 3 + 1] < -450) pos[i * 3 + 1] = 450;
          // Wrap on Z
          if (pos[i * 3 + 2] > 200) pos[i * 3 + 2] = -300;
          else if (pos[i * 3 + 2] < -300) pos[i * 3 + 2] = 200;
        }
        particleGeo.attributes.position.needsUpdate = true;
      }

      composer.render();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
