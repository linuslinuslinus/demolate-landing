<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Demolate Records">
  <meta property="og:title" content="Demolate Records">
  <meta property="og:description" content="DMLT001 — 05.06.2026">
  <meta property="og:image" content="/assets/demolate-logo.svg">
  <title>Demolate Records</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      background: #000;
      color: #fff;
      font-family: 'Archivo Black', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body {
      /* 400vh of scroll = 2 full rotations */
      height: 400vh;
    }

    canvas#stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      opacity: 0;
      animation: enter 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    @keyframes enter {
      to { opacity: 1; }
    }

    .meta {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      animation: fade-in 1.5s ease-out 1.5s forwards;
      font-family: 'Archivo Black', monospace;
      z-index: 10;
    }

    .meta--left { left: 1.5rem; }
    .meta--right {
      right: 1.5rem;
      display: flex;
      gap: 1rem;
    }
    .meta a { color: #fff; text-decoration: none; }
    .meta a:hover { background: #fff; color: #000; }

    @keyframes fade-in { to { opacity: 1; } }

    @media (max-width: 640px) {
      .meta { font-size: 0.65rem; bottom: 1rem; }
      .meta--left { left: 1rem; }
      .meta--right { right: 1rem; gap: 0.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      body { height: 100vh; }
    }

    noscript .fallback-logo {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    noscript .fallback-logo img {
      width: min(58vw, 58vh);
      fill: #fff;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="meta meta--left">DMLT001 · 05.06.2026</div>
  <div class="meta meta--right">
    <a href="#" aria-label="Instagram">IG</a>
    <a href="#" aria-label="Bandcamp">BC</a>
    <a href="#" aria-label="SoundCloud">SC</a>
  </div>

  <noscript>
    <div class="fallback-logo">
      <img src="assets/demolate-logo.svg" alt="Demolate Records logo" style="width: min(58vw, 58vh); filter: invert(1);">
    </div>
  </noscript>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const canvas = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    const scene = new THREE.Scene();

    // Generate a procedural studio environment (PMREM-encoded) for proper
    // reflections + ambient bounce on PBR materials. No external HDR fetch.
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    // Perspective camera. We push the camera back far enough that the
    // logo fills ~58% of the smaller viewport dimension.
    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
    camera.position.set(0, 0, 1200);

    // Three-light setup for dramatic edge separation on the extruded side faces.
    // Ambient stays low because the HDR environment already provides global fill.
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
    keyLight.position.set(400, 600, 800);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xc8d4e8, 0.45);
    fillLight.position.set(-500, -200, 300);
    scene.add(fillLight);

    // Rim light from behind for silhouette pop during rotation.
    const rimLight = new THREE.DirectionalLight(0xffffff, 0.7);
    rimLight.position.set(0, 200, -800);
    scene.add(rimLight);

    // -- Procedural concrete textures --
    // Generate normalMap + roughnessMap via Canvas2D so we don't ship
    // multi-MB texture files. Tileable noise → bumpy industrial concrete feel.
    function makeNoiseCanvas(size, octaves = 4) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      // Multi-octave value noise via random + smoothing
      for (let i = 0; i < img.data.length; i += 4) {
        let v = 0;
        let amp = 1;
        let sum = 0;
        for (let o = 0; o < octaves; o++) {
          v += Math.random() * amp;
          sum += amp;
          amp *= 0.55;
        }
        v = (v / sum) * 255;
        img.data[i] = v;
        img.data[i + 1] = v;
        img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      // Box blur for grit smoothness
      ctx.filter = 'blur(0.7px) contrast(1.15)';
      ctx.drawImage(c, 0, 0);
      return c;
    }

    function canvasToNormalMap(srcCanvas, strength = 1.0) {
      const size = srcCanvas.width;
      const sctx = srcCanvas.getContext('2d');
      const srcImg = sctx.getImageData(0, 0, size, size);
      const dst = document.createElement('canvas');
      dst.width = dst.height = size;
      const dctx = dst.getContext('2d');
      const dstImg = dctx.createImageData(size, size);
      const idx = (x, y) => (((y + size) % size) * size + ((x + size) % size)) * 4;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const tl = srcImg.data[idx(x - 1, y - 1)];
          const t  = srcImg.data[idx(x, y - 1)];
          const tr = srcImg.data[idx(x + 1, y - 1)];
          const l  = srcImg.data[idx(x - 1, y)];
          const r  = srcImg.data[idx(x + 1, y)];
          const bl = srcImg.data[idx(x - 1, y + 1)];
          const b  = srcImg.data[idx(x, y + 1)];
          const br = srcImg.data[idx(x + 1, y + 1)];
          // Sobel
          const dx = (tr + 2 * r + br) - (tl + 2 * l + bl);
          const dy = (bl + 2 * b + br) - (tl + 2 * t + tr);
          const dz = 255 / strength;
          // Normalize
          const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
          const i = (y * size + x) * 4;
          dstImg.data[i]     = ((dx / len) * 0.5 + 0.5) * 255;
          dstImg.data[i + 1] = ((dy / len) * 0.5 + 0.5) * 255;
          dstImg.data[i + 2] = ((dz / len) * 0.5 + 0.5) * 255;
          dstImg.data[i + 3] = 255;
        }
      }
      dctx.putImageData(dstImg, 0, 0);
      return dst;
    }

    const noiseCanvas = makeNoiseCanvas(512, 5);
    const normalCanvas = canvasToNormalMap(noiseCanvas, 8.0);

    const roughnessTex = new THREE.CanvasTexture(noiseCanvas);
    roughnessTex.wrapS = roughnessTex.wrapT = THREE.RepeatWrapping;
    roughnessTex.repeat.set(3, 1.5);

    const normalTex = new THREE.CanvasTexture(normalCanvas);
    normalTex.wrapS = normalTex.wrapT = THREE.RepeatWrapping;
    normalTex.repeat.set(3, 1.5);
    normalTex.colorSpace = THREE.NoColorSpace;

    // Logo SVG embedded inline so SVGLoader can parse without an extra fetch.
    const svgString = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1003.09 470.89">
<path d="m459.39,47.59C432.21,19.64,394.56,1.93,352.73.76c-2.86-.05-5.78.58-8.4,1.75L11.79,150.46c-7.13,3.2-11.79,10.34-11.79,18.2v134.37c0,7.81,4.66,14.94,11.79,18.14l332.54,147.96c2.62,1.21,5.54,1.84,8.4,1.75,83.61-2.33,150.62-70.8,150.62-154.95v-160.18c0-42.07-16.74-80.26-43.96-108.16Zm-111.03,210.31c0,32.07-25.96,58.03-58.03,58.03h-115.45c-10.96,0-19.84-8.92-19.84-19.89v-120.44c0-10.97,8.88-19.85,19.84-19.85h116.71c31.34,0,56.77,25.38,56.77,56.73v45.42Z"/>
<path d="m998.85,328.79l-311.97,138.79c-3.69,1.65-7.67,2.52-11.75,2.52h-6.69c-78.52,0-142.18-63.67-142.18-142.18v-176.54C526.26,70.1,590.21,3.82,670.57.03c4.47-.19,8.98.63,13.06,2.43l314.88,138.73c7.08,3.11,4.85,13.69-2.91,13.69h-272.04c-23.34,0-42.26,18.92-42.26,42.31v75.6c0,23.35,18.92,42.27,42.26,42.27h272.38c7.71,0,9.94,10.58,2.91,13.73Z"/>
</svg>`;

    const loader = new SVGLoader();
    const data = loader.parse(svgString);

    // Two nested groups:
    //  - innerGroup applies the SVG Y-down → Three.js Y-up flip via rotation
    //    (NOT via geometry.scale(1,-1,1), which reverses face winding and
    //    breaks normals, leaving the mesh effectively invisible against the
    //    dark background under MeshStandardMaterial lighting).
    //  - logoGroup is the parent the scroll handler rotates on Y.
    const innerGroup = new THREE.Group();
    const logoGroup = new THREE.Group();
    logoGroup.add(innerGroup);

    // Physical material — cast concrete look. PBR with procedural noise maps,
    // env-map driven reflections (subtle, since roughness is high), no metalness.
    const material = new THREE.MeshPhysicalMaterial({
      color: 0xf6f5f1,          // off-white, like cast concrete
      roughness: 0.78,           // matte, gritty
      metalness: 0.0,
      roughnessMap: roughnessTex,
      normalMap: normalTex,
      normalScale: new THREE.Vector2(0.35, 0.35),  // subtle bump
      envMapIntensity: 0.85,
      clearcoat: 0.06,           // microscopic sheen, just enough to catch light
      clearcoatRoughness: 0.55,
    });

    // Extrude each path into a real 3D mesh with depth.
    const extrudeSettings = {
      depth: 110,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 2,
      bevelThickness: 2,
      curveSegments: 24,
    };

    data.paths.forEach((path) => {
      const shapes = SVGLoader.createShapes(path);
      shapes.forEach((shape) => {
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.computeVertexNormals();
        const mesh = new THREE.Mesh(geometry, material);
        innerGroup.add(mesh);
      });
    });

    // Flip Y via rotation (preserves face winding + normals).
    innerGroup.rotation.x = Math.PI;
    // Apply the matrices so bbox math below sees the flipped geometry.
    logoGroup.updateMatrixWorld(true);

    // Center the whole logoGroup on the scene origin.
    const bbox = new THREE.Box3().setFromObject(logoGroup);
    const center = new THREE.Vector3();
    bbox.getCenter(center);
    // Center by translating innerGroup (so logoGroup's local origin stays at 0,0,0
    // and our scroll-driven Y rotation pivots around the logo center).
    innerGroup.position.sub(center);

    scene.add(logoGroup);

    // Diagnostics: log path/mesh counts so we can confirm parsing worked.
    console.log('[demolate] SVG paths parsed:', data.paths.length, '· meshes added:', innerGroup.children.length);

    // -- Post-processing pipeline --
    // RenderPass -> UnrealBloomPass (subtle, makes white edges glow gently)
    // -> Vignette ShaderPass -> OutputPass
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.45,  // strength
      0.85,  // radius
      0.82   // threshold
    );
    composer.addPass(bloomPass);

    // Custom vignette shader pass: subtle dark corners, focus on center.
    const vignettePass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        offset: { value: 1.05 },
        darkness: { value: 1.4 },
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float offset;
        uniform float darkness;
        varying vec2 vUv;
        void main() {
          vec4 texel = texture2D(tDiffuse, vUv);
          vec2 uv = (vUv - 0.5) * vec2(offset);
          float vig = 1.0 - dot(uv, uv) * darkness;
          gl_FragColor = vec4(texel.rgb * vig, texel.a);
        }
      `,
    });
    composer.addPass(vignettePass);
    composer.addPass(new OutputPass());

    // Scroll-driven rotation
    const TOTAL_ROTATION = Math.PI * 4; // 2 full revolutions across the scroll
    let targetRot = 0;
    let currentRot = 0;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function updateScroll() {
      const maxScroll = document.body.scrollHeight - window.innerHeight;
      const progress = maxScroll > 0 ? window.scrollY / maxScroll : 0;
      targetRot = progress * TOTAL_ROTATION;
    }

    window.addEventListener('scroll', updateScroll, { passive: true });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      // Fit logo into ~58% of the smaller viewport dimension.
      const fovRad = camera.fov * Math.PI / 180;
      const visibleHeight = 2 * Math.tan(fovRad / 2) * camera.position.z;
      const visibleWidth = visibleHeight * camera.aspect;
      const target = Math.min(visibleWidth, visibleHeight) * 0.58;
      const bboxSize = bbox.getSize(new THREE.Vector3());
      const scale = Math.min(target / bboxSize.x, target / bboxSize.y);
      logoGroup.scale.setScalar(scale);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();
    updateScroll();

    function animate() {
      // Smooth-follow the target rotation (light lerp so scroll feels physical)
      currentRot += (targetRot - currentRot) * 0.12;
      logoGroup.rotation.y = prefersReducedMotion ? 0 : currentRot;
      composer.render();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
