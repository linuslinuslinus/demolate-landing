<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Demolate Records">
  <meta property="og:title" content="Demolate Records">
  <meta property="og:description" content="DMLT001 — 05.06.2026">
  <meta property="og:image" content="/assets/demolate-logo.svg">
  <title>Demolate Records</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Archivo Black', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      overscroll-behavior: none;
      cursor: grab;
    }
    body.grabbing { cursor: grabbing; }
    body::-webkit-scrollbar { display: none; }

    canvas#stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      opacity: 0;
      animation: enter 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    @keyframes enter { to { opacity: 1; } }

    .meta {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0;
      animation: fade-in 1.5s ease-out 1.5s forwards;
      font-family: 'Archivo Black', monospace;
      z-index: 10;
    }
    .meta--left { left: 1.5rem; }
    .meta--right { right: 1.5rem; display: flex; gap: 1rem; }
    .meta a { color: #fff; text-decoration: none; }
    .meta a:hover { background: #fff; color: #000; }
    @keyframes fade-in { to { opacity: 1; } }

    @media (max-width: 640px) {
      .meta { font-size: 0.65rem; bottom: 1rem; }
      .meta--left { left: 1rem; }
      .meta--right { right: 1rem; gap: 0.75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html, body { cursor: default; }
    }

    noscript .fallback-logo {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    noscript .fallback-logo img { width: min(58vw, 58vh); }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="meta meta--left">DMLT001 · 05.06.2026</div>
  <div class="meta meta--right">
    <a href="#" aria-label="Instagram">IG</a>
    <a href="#" aria-label="Bandcamp">BC</a>
    <a href="#" aria-label="SoundCloud">SC</a>
  </div>

  <noscript>
    <div class="fallback-logo">
      <img src="assets/demolate-logo.svg" alt="Demolate Records logo" style="width: min(58vw, 58vh); filter: invert(1);">
    </div>
  </noscript>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const canvas = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 1);

    const scene = new THREE.Scene();

    // PMREM-encoded environment for proper metallic reflections.
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
    camera.position.set(0, 0, 1200);

    // Lighting — KEEP THIS WORKING. Don't dial ambient below 0.4 or the surface
    // goes black on dark background.
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(400, 600, 800);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.55);
    fillLight.position.set(-500, -300, 400);
    scene.add(fillLight);

    // -- Weathered chrome / aged gunmetal texture --
    // Reference look: polished metal with random scratches in all directions
    // + cloudy wear patches + occasional bright spots where the surface is rubbed.
    // Built procedurally on a 2D canvas (faster than per-pixel heightmap loops).
    const TEX_SIZE = 1024;
    function makeWeatheredCanvas(size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');

      // Base — mid gray (satin steel)
      ctx.fillStyle = '#8a8a8a';
      ctx.fillRect(0, 0, size, size);

      // Layer 1: fine micro-grain (film-grain-like noise across whole surface).
      // Tiny 1px specks with low alpha give the surface tooth without scratches.
      const grainImg = ctx.createImageData(size, size);
      for (let i = 0; i < grainImg.data.length; i += 4) {
        const v = 138 + (Math.random() - 0.5) * 22;  // ±11 around 138 (close to base)
        grainImg.data[i] = v;
        grainImg.data[i + 1] = v;
        grainImg.data[i + 2] = v;
        grainImg.data[i + 3] = 255;
      }
      ctx.putImageData(grainImg, 0, 0);

      // Layer 2: subtle wear patches (much fainter than before — soft mottling).
      for (let i = 0; i < 28; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const r = 60 + Math.random() * 220;
        const dark = Math.random() < 0.5;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, dark ? 'rgba(80,80,80,0.22)' : 'rgba(200,200,200,0.18)');
        grad.addColorStop(0.6, dark ? 'rgba(100,100,100,0.10)' : 'rgba(180,180,180,0.08)');
        grad.addColorStop(1, 'rgba(128,128,128,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Layer 3: HIGH-DENSITY fine micro-scratches (mostly short, mostly subtle).
      // ~2200 hairline marks. Random angles. Variable opacity. This is the
      // dominant character of a well-used construction-grade tool.
      ctx.lineCap = 'round';
      ctx.globalCompositeOperation = 'source-over';
      for (let i = 0; i < 2200; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const angle = Math.random() * Math.PI * 2;
        const len = 2 + Math.random() * 14;  // very short: 2-16px
        const dark = Math.random() < 0.62;
        const alpha = 0.05 + Math.random() * 0.18;  // soft
        ctx.strokeStyle = dark
          ? `rgba(45,45,45,${alpha})`
          : `rgba(225,225,225,${alpha})`;
        ctx.lineWidth = 0.4 + Math.random() * 0.6;  // hairline
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
        ctx.stroke();
      }

      // Layer 4: rare larger scratches (the occasional heavier mark).
      for (let i = 0; i < 22; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const angle = Math.random() * Math.PI * 2;
        const len = 25 + Math.random() * 60;
        const alpha = 0.15 + Math.random() * 0.2;
        ctx.strokeStyle = Math.random() < 0.5
          ? `rgba(50,50,50,${alpha})`
          : `rgba(220,220,220,${alpha})`;
        ctx.lineWidth = 0.6 + Math.random() * 0.6;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
        ctx.stroke();
      }

      // Layer 5: small dings / pits (tiny dark dots — chipped paint, gouges)
      for (let i = 0; i < 90; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const r = 1 + Math.random() * 2.5;
        ctx.fillStyle = `rgba(35,35,35,${0.3 + Math.random() * 0.3})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      return c;
    }

    const weatheredCanvas = makeWeatheredCanvas(TEX_SIZE);
    // Extract grayscale heights from canvas for normal-map derivation
    const ___ictx = weatheredCanvas.getContext('2d');
    const ___idata = ___ictx.getImageData(0, 0, TEX_SIZE, TEX_SIZE);
    const heights = new Float32Array(TEX_SIZE * TEX_SIZE);
    for (let i = 0; i < heights.length; i++) {
      heights[i] = ___idata.data[i * 4] / 255;
    }

    // Render heightmap as grayscale CanvasTexture (used for roughness modulation)
    const heightCanvas = document.createElement('canvas');
    heightCanvas.width = heightCanvas.height = TEX_SIZE;
    const hctx = heightCanvas.getContext('2d');
    const himg = hctx.createImageData(TEX_SIZE, TEX_SIZE);
    for (let i = 0; i < heights.length; i++) {
      const px = heights[i] * 255;
      himg.data[i*4] = px;
      himg.data[i*4+1] = px;
      himg.data[i*4+2] = px;
      himg.data[i*4+3] = 255;
    }
    hctx.putImageData(himg, 0, 0);

    // Sobel-derived normal map from heightmap
    const normalCanvas = document.createElement('canvas');
    normalCanvas.width = normalCanvas.height = TEX_SIZE;
    const nctx = normalCanvas.getContext('2d');
    const nimg = nctx.createImageData(TEX_SIZE, TEX_SIZE);
    const at = (x, y) => heights[((y+TEX_SIZE)%TEX_SIZE)*TEX_SIZE + ((x+TEX_SIZE)%TEX_SIZE)] * 255;
    for (let y = 0; y < TEX_SIZE; y++) {
      for (let x = 0; x < TEX_SIZE; x++) {
        const dx = (at(x+1,y-1)+2*at(x+1,y)+at(x+1,y+1)) - (at(x-1,y-1)+2*at(x-1,y)+at(x-1,y+1));
        const dy = (at(x-1,y+1)+2*at(x,y+1)+at(x+1,y+1)) - (at(x-1,y-1)+2*at(x,y-1)+at(x+1,y-1));
        const dz = 100;
        const len = Math.hypot(dx, dy, dz) || 1;
        const i = (y*TEX_SIZE+x)*4;
        nimg.data[i] = ((dx/len)*0.5+0.5)*255;
        nimg.data[i+1] = ((dy/len)*0.5+0.5)*255;
        nimg.data[i+2] = ((dz/len)*0.5+0.5)*255;
        nimg.data[i+3] = 255;
      }
    }
    nctx.putImageData(nimg, 0, 0);

    // ExtrudeGeometry UVs are in shape coords (~0..1003), not normalized.
    // For weathered chrome we want 2-3 visible tiles across the logo so the
    // scratches and wear patches read at scene scale (not too fine, not too coarse).
    const TILES = 2.5;
    const REPEAT_X = TILES / 1003;
    const REPEAT_Y = TILES / 471 * (471 / 1003);  // keep square-ish tiles given aspect

    const roughnessTex = new THREE.CanvasTexture(weatheredCanvas);
    roughnessTex.wrapS = roughnessTex.wrapT = THREE.RepeatWrapping;
    roughnessTex.repeat.set(REPEAT_X, REPEAT_Y);
    roughnessTex.colorSpace = THREE.NoColorSpace;

    const normalTex = new THREE.CanvasTexture(normalCanvas);
    normalTex.wrapS = normalTex.wrapT = THREE.RepeatWrapping;
    normalTex.repeat.set(REPEAT_X, REPEAT_Y);
    normalTex.colorSpace = THREE.NoColorSpace;

    // Construction-grade steel — satin finish, well-used tool surface.
    // Base roughness 0.55 (satin, not chrome-polished). Map adds micro-grain
    // variation. Slightly cooler color shift, less mirror-like.
    const material = new THREE.MeshPhysicalMaterial({
      color: 0x787d82,            // satin steel
      metalness: 1.0,
      roughness: 0.55,             // satin, not glossy
      roughnessMap: roughnessTex,
      normalMap: normalTex,
      normalScale: new THREE.Vector2(0.4, 0.4),  // subtler bump
      envMapIntensity: 1.15,
    });

    const innerGroup = new THREE.Group();
    const logoGroup = new THREE.Group();
    logoGroup.add(innerGroup);

    const loader = new SVGLoader();
    const data = loader.parse(`<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1003.09 470.89">
<path d="m459.39,47.59C432.21,19.64,394.56,1.93,352.73.76c-2.86-.05-5.78.58-8.4,1.75L11.79,150.46c-7.13,3.2-11.79,10.34-11.79,18.2v134.37c0,7.81,4.66,14.94,11.79,18.14l332.54,147.96c2.62,1.21,5.54,1.84,8.4,1.75,83.61-2.33,150.62-70.8,150.62-154.95v-160.18c0-42.07-16.74-80.26-43.96-108.16Zm-111.03,210.31c0,32.07-25.96,58.03-58.03,58.03h-115.45c-10.96,0-19.84-8.92-19.84-19.89v-120.44c0-10.97,8.88-19.85,19.84-19.85h116.71c31.34,0,56.77,25.38,56.77,56.73v45.42Z"/>
<path d="m998.85,328.79l-311.97,138.79c-3.69,1.65-7.67,2.52-11.75,2.52h-6.69c-78.52,0-142.18-63.67-142.18-142.18v-176.54C526.26,70.1,590.21,3.82,670.57.03c4.47-.19,8.98.63,13.06,2.43l314.88,138.73c7.08,3.11,4.85,13.69-2.91,13.69h-272.04c-23.34,0-42.26,18.92-42.26,42.31v75.6c0,23.35,18.92,42.27,42.26,42.27h272.38c7.71,0,9.94,10.58,2.91,13.73Z"/>
</svg>`);

    const extrudeSettings = {
      depth: 110,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 2,
      bevelThickness: 2,
      curveSegments: 24,
    };

    data.paths.forEach((path) => {
      SVGLoader.createShapes(path).forEach((shape) => {
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.computeVertexNormals();
        innerGroup.add(new THREE.Mesh(geometry, material));
      });
    });

    innerGroup.rotation.x = Math.PI;
    logoGroup.updateMatrixWorld(true);
    const bbox = new THREE.Box3().setFromObject(logoGroup);
    const center = new THREE.Vector3();
    bbox.getCenter(center);
    innerGroup.position.sub(center);
    scene.add(logoGroup);

    console.log('[demolate] paths:', data.paths.length, 'meshes:', innerGroup.children.length);

    // Post-processing
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.1,   // strength — minimal
      0.6,   // radius
      0.92   // threshold — only brightest highlights
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // Wheel + drag-driven endless rotation (no scrolling)
    let targetRot = 0;
    let currentRot = 0;
    const WHEEL_SENSITIVITY = 0.003;
    const DRAG_SENSITIVITY = 0.008;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetRot += e.deltaY * WHEEL_SENSITIVITY;
    }, { passive: false });

    let dragging = false;
    let dragStartX = 0;
    let dragStartRot = 0;
    function startDrag(x) {
      dragging = true;
      dragStartX = x;
      dragStartRot = targetRot;
      document.body.classList.add('grabbing');
    }
    function moveDrag(x) {
      if (!dragging) return;
      targetRot = dragStartRot + (x - dragStartX) * DRAG_SENSITIVITY;
    }
    function endDrag() {
      dragging = false;
      document.body.classList.remove('grabbing');
    }
    canvas.addEventListener('mousedown', (e) => startDrag(e.clientX));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchend', endDrag);

    // Mouse parallax (subtle scene tilt)
    let parallaxX = 0, parallaxY = 0;
    let parallaxTargetX = 0, parallaxTargetY = 0;
    window.addEventListener('mousemove', (e) => {
      if (dragging) return;
      parallaxTargetX = (e.clientX / window.innerWidth - 0.5) * 2;
      parallaxTargetY = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      const fovRad = camera.fov * Math.PI / 180;
      const visibleHeight = 2 * Math.tan(fovRad / 2) * camera.position.z;
      const visibleWidth = visibleHeight * camera.aspect;
      const target = Math.min(visibleWidth, visibleHeight) * 0.58;
      const bboxSize = bbox.getSize(new THREE.Vector3());
      const scale = Math.min(target / bboxSize.x, target / bboxSize.y);
      logoGroup.scale.setScalar(scale);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    function animate() {
      currentRot += (targetRot - currentRot) * 0.12;
      logoGroup.rotation.y = prefersReducedMotion ? 0 : currentRot;

      parallaxX += (parallaxTargetX - parallaxX) * 0.05;
      parallaxY += (parallaxTargetY - parallaxY) * 0.05;
      if (!prefersReducedMotion) {
        logoGroup.rotation.x = parallaxY * 0.1;
      }

      composer.render();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
