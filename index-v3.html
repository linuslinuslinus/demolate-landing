  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    const canvas = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 1);

    const scene = new THREE.Scene();

    // PMREM-encoded environment for proper metallic reflections.
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
    camera.position.set(0, 0, 1200);

    // Lighting — KEEP THIS WORKING. Don't dial ambient below 0.4 or the surface
    // goes black on dark background.
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(400, 600, 800);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.55);
    fillLight.position.set(-500, -300, 400);
    scene.add(fillLight);

    // -- Procedural rust-iron textures (canvas 2D, fully self-contained) --
    // Variant 3 of 5. No external image fetches.
    // Generates 3 CanvasTextures (color, roughness, ao) at init time only.
    function makeRustIronTexture(variant, size) {
      size = size || 512;
      // Deterministic seeded RNG (mulberry32) — same variant always looks the same.
      function makeRng(seed) {
        let s = seed >>> 0;
        return function() {
          s = (s + 0x6D2B79F5) >>> 0;
          let t = s;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rng = makeRng(1729 + variant * 9973);
      function mk() {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        return { c: c, ctx: c.getContext('2d') };
      }
      const color = mk(), rough = mk(), ao = mk();

      // Variant base colors — mid-gray so PBR lighting reads them as iron.
      const BASES = {
        1: { c: '#54575a', r: '#a8a8a8', a: '#dddddd' },  // pitting — neutral iron
        2: { c: '#4a4742', r: '#9c9c9c', a: '#d4d4d4' },  // oxidation — warm dark
        3: { c: '#60636a', r: '#b0b0b0', a: '#dfdfdf' },  // scratches — lighter steel
        4: { c: '#4e5054', r: '#a4a4a4', a: '#d8d8d8' },  // layered — dark base
        5: { c: '#52555a', r: '#aaaaaa', a: '#dcdcdc' },  // composite — balanced
      };
      const base = BASES[variant];

      // Paint base + fine grain noise (broken-up, not flat).
      (function paintBase() {
        [color.ctx, rough.ctx, ao.ctx].forEach(function(ctx, i) {
          ctx.fillStyle = i === 0 ? base.c : i === 1 ? base.r : base.a;
          ctx.fillRect(0, 0, size, size);
        });
        const cd = color.ctx.getImageData(0, 0, size, size);
        const rd = rough.ctx.getImageData(0, 0, size, size);
        for (let i = 0; i < cd.data.length; i += 4) {
          const n = (rng() - 0.5) * 22;
          cd.data[i] = Math.max(0, Math.min(255, cd.data[i] + n));
          cd.data[i+1] = Math.max(0, Math.min(255, cd.data[i+1] + n));
          cd.data[i+2] = Math.max(0, Math.min(255, cd.data[i+2] + n));
          const m = (rng() - 0.5) * 34;
          const v = Math.max(0, Math.min(255, rd.data[i] + m));
          rd.data[i] = rd.data[i+1] = rd.data[i+2] = v;
        }
        color.ctx.putImageData(cd, 0, 0);
        rough.ctx.putImageData(rd, 0, 0);
      })();

      // PIT primitive — radial dark spot on color, bright on roughness, dark on AO.
      function drawPit(x, y, r) {
        let g = color.ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(10,10,12,0.92)');
        g.addColorStop(0.55, 'rgba(20,20,22,0.45)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        color.ctx.fillStyle = g;
        color.ctx.beginPath(); color.ctx.arc(x, y, r, 0, Math.PI*2); color.ctx.fill();

        g = rough.ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,255,255,0.8)');
        g.addColorStop(0.7, 'rgba(220,220,220,0.4)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        rough.ctx.fillStyle = g;
        rough.ctx.beginPath(); rough.ctx.arc(x, y, r, 0, Math.PI*2); rough.ctx.fill();

        g = ao.ctx.createRadialGradient(x, y, 0, x, y, r * 1.25);
        g.addColorStop(0, 'rgba(25,25,25,0.85)');
        g.addColorStop(0.7, 'rgba(140,140,140,0.4)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ao.ctx.fillStyle = g;
        ao.ctx.beginPath(); ao.ctx.arc(x, y, r * 1.25, 0, Math.PI*2); ao.ctx.fill();
      }
      function drawPitting(count) {
        for (let i = 0; i < count; i++) {
          drawPit(rng() * size, rng() * size, 1.5 + rng() * 9);
        }
      }

      // OXIDATION — recursive branching random walk (dendritic rust).
      function drawRustBranch(x, y, angle, len, width, depth, opacity) {
        if (depth <= 0 || len < 4) return;
        let cx = x, cy = y, ca = angle, rem = len, w = width;
        while (rem > 3) {
          const seg = 3 + rng() * 7;
          ca += (rng() - 0.5) * 0.7;
          const nx = cx + Math.cos(ca) * seg;
          const ny = cy + Math.sin(ca) * seg;
          const r = Math.floor(110 + rng() * 55);
          const g = Math.floor(48 + rng() * 28);
          const b = Math.floor(14 + rng() * 18);
          color.ctx.strokeStyle = 'rgba('+r+','+g+','+b+','+opacity.toFixed(3)+')';
          color.ctx.lineWidth = w;
          color.ctx.lineCap = 'round';
          color.ctx.beginPath(); color.ctx.moveTo(cx, cy); color.ctx.lineTo(nx, ny); color.ctx.stroke();
          rough.ctx.strokeStyle = 'rgba(245,245,245,'+(opacity*0.7).toFixed(3)+')';
          rough.ctx.lineWidth = w;
          rough.ctx.beginPath(); rough.ctx.moveTo(cx, cy); rough.ctx.lineTo(nx, ny); rough.ctx.stroke();
          cx = nx; cy = ny;
          rem -= seg;
          w *= 0.965;
          if (rng() < 0.09 && depth > 0) {
            drawRustBranch(cx, cy, ca + (rng() < 0.5 ? 0.7 : -0.7),
                           rem * 0.45, w * 0.7, depth - 1, opacity * 0.85);
          }
        }
      }
      function drawOxidation(roots, opacityMul) {
        for (let i = 0; i < roots; i++) {
          drawRustBranch(rng() * size, rng() * size,
                         rng() * Math.PI * 2,
                         30 + rng() * 90, 1.8 + rng() * 1.5,
                         3, 0.45 * opacityMul);
        }
      }

      // SCRATCHES — quadratic-bezier thin lines, biased near-horizontal.
      function drawScratches(count) {
        for (let i = 0; i < count; i++) {
          const sx = rng() * size, sy = rng() * size;
          const angle = (rng() < 0.78)
            ? (rng() - 0.5) * 0.55
            : rng() * Math.PI * 2;
          const len = 40 + rng() * 160;
          const ex = sx + Math.cos(angle) * len;
          const ey = sy + Math.sin(angle) * len;
          const co = (rng() - 0.5) * 14;
          const mx = (sx + ex) / 2 + Math.cos(angle + Math.PI/2) * co;
          const my = (sy + ey) / 2 + Math.sin(angle + Math.PI/2) * co;
          const op = 0.4 + rng() * 0.45;
          const lw = 0.5 + rng() * 1.3;
          color.ctx.strokeStyle = 'rgba(205,208,212,'+(op*0.55).toFixed(3)+')';
          color.ctx.lineWidth = lw;
          color.ctx.beginPath();
          color.ctx.moveTo(sx, sy);
          color.ctx.quadraticCurveTo(mx, my, ex, ey);
          color.ctx.stroke();
          rough.ctx.strokeStyle = 'rgba(230,230,230,'+(op*0.7).toFixed(3)+')';
          rough.ctx.lineWidth = lw;
          rough.ctx.beginPath();
          rough.ctx.moveTo(sx, sy);
          rough.ctx.quadraticCurveTo(mx, my, ex, ey);
          rough.ctx.stroke();
          if (rng() < 0.3) {
            color.ctx.strokeStyle = 'rgba(45,45,50,'+(op*0.8).toFixed(3)+')';
            color.ctx.lineWidth = 0.5;
            color.ctx.beginPath();
            color.ctx.moveTo(sx + 0.7, sy + 0.7);
            color.ctx.quadraticCurveTo(mx + 0.7, my + 0.7, ex + 0.7, ey + 0.7);
            color.ctx.stroke();
          }
        }
      }

      // LAYERED — worn-through patches revealing brighter substrate.
      function drawLayeredPatch(cx, cy, baseR) {
        const sides = 10 + Math.floor(rng() * 6);
        const pts = [];
        for (let i = 0; i < sides; i++) {
          const a = (i / sides) * Math.PI * 2;
          const r = baseR * (0.65 + rng() * 0.65);
          pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
        }
        function tracePath(ctx, inset) {
          ctx.beginPath();
          for (let i = 0; i < pts.length; i++) {
            let px = pts[i][0], py = pts[i][1];
            if (inset > 0) {
              const dx = pts[i][0] - cx, dy = pts[i][1] - cy;
              const len = Math.hypot(dx, dy) || 1;
              px -= (dx/len) * inset;
              py -= (dy/len) * inset;
            }
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
        }
        // Dark rim on color
        color.ctx.fillStyle = 'rgba(8,8,10,0.85)';
        tracePath(color.ctx, 0); color.ctx.fill();
        // Brighter substrate (inset)
        color.ctx.fillStyle = '#7a8084';
        tracePath(color.ctx, 5); color.ctx.fill();
        // Substrate is smoother (lower roughness)
        rough.ctx.fillStyle = 'rgba(70,70,70,0.85)';
        tracePath(rough.ctx, 5); rough.ctx.fill();
        // Rim shadow on AO
        ao.ctx.strokeStyle = 'rgba(40,40,40,0.8)';
        ao.ctx.lineWidth = 5;
        tracePath(ao.ctx, 0); ao.ctx.stroke();
      }
      function drawLayered(count) {
        for (let i = 0; i < count; i++) {
          drawLayeredPatch(rng() * size, rng() * size, 18 + rng() * 38);
        }
      }

      // Variant dispatch.
      switch (variant) {
        case 1: drawPitting(420); break;
        case 2: drawOxidation(7, 1.0); drawPitting(80); break;
        case 3: drawScratches(120); break;
        case 4: drawLayered(12); drawPitting(70); break;
        case 5: drawPitting(180); drawOxidation(3, 0.7); drawScratches(45); break;
      }

      function wrap(canvas, srgb) {
        const t = new THREE.CanvasTexture(canvas);
        t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
        t.flipY = false;
        t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
        return t;
      }
      return {
        colorMap: wrap(color.c, true),
        roughnessMap: wrap(rough.c, false),
        aoMap: wrap(ao.c, false),
      };
    }

    const VARIANT = 3;
    console.time('[demolate] texgen');
    const __rustTex = makeRustIronTexture(VARIANT);
    console.timeEnd('[demolate] texgen');

    // Variant-tuned material parameters. Map drives color; small tint via .color.
    const VARIANT_PARAMS = ({
      1: { color: 0xffffff, metalness: 0.92, roughness: 0.78 },
      2: { color: 0xfff4ec, metalness: 0.88, roughness: 0.88 },
      3: { color: 0xffffff, metalness: 0.95, roughness: 0.62 },
      4: { color: 0xffffff, metalness: 0.93, roughness: 0.74 },
      5: { color: 0xfff8f4, metalness: 0.90, roughness: 0.82 },
    })[VARIANT];

    // Clean aged iron — procedural color + roughness + AO drive the look.
    // normalScale set to Vector2(0,0) so the M-key tween path stays alive
    // even though no normal map is supplied.
    const material = new THREE.MeshPhysicalMaterial({
      color: VARIANT_PARAMS.color,
      metalness: VARIANT_PARAMS.metalness,
      roughness: VARIANT_PARAMS.roughness,
      map: __rustTex.colorMap,
      roughnessMap: __rustTex.roughnessMap,
      normalScale: new THREE.Vector2(0, 0),
      aoMap: __rustTex.aoMap,
      aoMapIntensity: 0.9,
      envMapIntensity: 1.2,
    });

    // Three-level group hierarchy:
    //   parallaxGroup → handles mouse-parallax tilt (rotation.x + rotation.y)
    //     └── logoGroup → handles scroll-driven spin (rotation.y)
    //           └── innerGroup → SVG Y-flip + meshes
    // This separation lets us apply parallax-Y rotation (left-right tilt)
    // WITHOUT clashing with the spin's rotation.y.
    const innerGroup = new THREE.Group();
    const logoGroup = new THREE.Group();
    const parallaxGroup = new THREE.Group();
    parallaxGroup.add(logoGroup);
    logoGroup.add(innerGroup);

    const loader = new SVGLoader();
    const data = loader.parse(`<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1003.09 470.89">
<path d="m459.39,47.59C432.21,19.64,394.56,1.93,352.73.76c-2.86-.05-5.78.58-8.4,1.75L11.79,150.46c-7.13,3.2-11.79,10.34-11.79,18.2v134.37c0,7.81,4.66,14.94,11.79,18.14l332.54,147.96c2.62,1.21,5.54,1.84,8.4,1.75,83.61-2.33,150.62-70.8,150.62-154.95v-160.18c0-42.07-16.74-80.26-43.96-108.16Zm-111.03,210.31c0,32.07-25.96,58.03-58.03,58.03h-115.45c-10.96,0-19.84-8.92-19.84-19.89v-120.44c0-10.97,8.88-19.85,19.84-19.85h116.71c31.34,0,56.77,25.38,56.77,56.73v45.42Z"/>
<path d="m998.85,328.79l-311.97,138.79c-3.69,1.65-7.67,2.52-11.75,2.52h-6.69c-78.52,0-142.18-63.67-142.18-142.18v-176.54C526.26,70.1,590.21,3.82,670.57.03c4.47-.19,8.98.63,13.06,2.43l314.88,138.73c7.08,3.11,4.85,13.69-2.91,13.69h-272.04c-23.34,0-42.26,18.92-42.26,42.31v75.6c0,23.35,18.92,42.27,42.26,42.27h272.38c7.71,0,9.94,10.58,2.91,13.73Z"/>
</svg>`);

    // Custom UV generator:
    //  - Front + back faces: normalize UVs to 0..1 over the logo bbox (1003×471)
    //    so texture.repeat = 1 means "one tile across the whole logo"
    //  - Side walls: single point UV (0.5, 0.5) — samples one texture pixel,
    //    appearing as solid color, no more visible tile-repeat grid on edges
    const LOGO_W = 1003.09, LOGO_H = 470.89;
    const customUVGenerator = {
      // Front + back: normalized 0..1 across the logo bbox.
      generateTopUV(geometry, vertices, indexA, indexB, indexC) {
        const ax = vertices[indexA * 3], ay = vertices[indexA * 3 + 1];
        const bx = vertices[indexB * 3], by = vertices[indexB * 3 + 1];
        const cx = vertices[indexC * 3], cy = vertices[indexC * 3 + 1];
        return [
          new THREE.Vector2(ax / LOGO_W, 1 - ay / LOGO_H),
          new THREE.Vector2(bx / LOGO_W, 1 - by / LOGO_H),
          new THREE.Vector2(cx / LOGO_W, 1 - cy / LOGO_H),
        ];
      },
      // Side walls: give each side-wall quad a small 2D AREA of the texture
      // (not a degenerate 1D line), so the side has the same density of
      // texture detail as the front face. We project the front-edge vertices
      // to their texture position, then offset the back-edge vertices INWARD
      // along the edge perpendicular by a small UV amount. Result: each side
      // quad samples a thin strip of texture perpendicular to the local edge,
      // giving the side the SAME scratch/roughness character as the front,
      // with no tile-repeats and no seams.
      generateSideWallUV(geometry, vertices, indexA, indexB, indexC, indexD) {
        const ax = vertices[indexA * 3], ay = vertices[indexA * 3 + 1];
        const bx = vertices[indexB * 3], by = vertices[indexB * 3 + 1];
        // Edge direction A→B and its perpendicular (in shape space)
        const dx = bx - ax, dy = by - ay;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;   // perpendicular, pointing into shape
        // Offset in UV space proportional to the extrusion depth so the strip
        // width matches the side's actual physical thickness.
        const depthUV = 0.10;
        const uAx = ax / LOGO_W, uAy = 1 - ay / LOGO_H;
        const uBx = bx / LOGO_W, uBy = 1 - by / LOGO_H;
        const offX = nx * depthUV, offY = -ny * depthUV;  // flipped Y for UV
        return [
          new THREE.Vector2(uAx,        uAy),
          new THREE.Vector2(uBx,        uBy),
          new THREE.Vector2(uBx + offX, uBy + offY),
          new THREE.Vector2(uAx + offX, uAy + offY),
        ];
      },
    };

    // Softer bevel + many curve segments. With only 28 curveSegments the
    // logo's circular shapes (D bowl, C bowl, the curve at the bottom) were
    // polygonal — and even with vertex-normal averaging, polygon edges
    // produce subtle shading bands visible along the side walls. Bumping
    // to 96 segments makes the curves read as truly smooth.
    const extrudeSettings = {
      depth: 110,
      bevelEnabled: true,
      bevelSegments: 10,
      bevelSize: 5,
      bevelThickness: 5,
      curveSegments: 96,
      UVGenerator: customUVGenerator,
    };

    data.paths.forEach((path) => {
      SVGLoader.createShapes(path).forEach((shape) => {
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.computeVertexNormals();
        innerGroup.add(new THREE.Mesh(geometry, material));
      });
    });

    innerGroup.rotation.x = Math.PI;
    logoGroup.updateMatrixWorld(true);
    const bbox = new THREE.Box3().setFromObject(logoGroup);
    const center = new THREE.Vector3();
    bbox.getCenter(center);
    innerGroup.position.sub(center);
    scene.add(parallaxGroup);

    console.log('[demolate] paths:', data.paths.length, 'meshes:', innerGroup.children.length);

    // -- Material switcher (M key cycles materials) --
    // Three preset looks: aged steel (default), polished silver, copper/bronze.
    // Smooth tween between them over ~0.6s when M is pressed.
    const MATERIAL_PRESETS = [
      { name: 'aged-steel',    color: 0x9aa0a4, metalness: 0.95, roughness: 1.0,  normalScale: 0.6, envMapIntensity: 1.2 },
      { name: 'polished',      color: 0xd2d5d8, metalness: 1.0,  roughness: 0.55, normalScale: 0.3, envMapIntensity: 1.8 },
      { name: 'copper-bronze', color: 0xb47238, metalness: 1.0,  roughness: 0.85, normalScale: 0.7, envMapIntensity: 1.4 },
      { name: 'black-metal',   color: 0x383a3c, metalness: 1.0,  roughness: 0.6,  normalScale: 0.55, envMapIntensity: 1.1 },
    ];
    let presetIdx = 0;
    let tweenT0 = 0, tweenDur = 600;
    let tweenFrom = null, tweenTo = null;

    function cyclePreset() {
      presetIdx = (presetIdx + 1) % MATERIAL_PRESETS.length;
      tweenFrom = {
        color: material.color.clone(),
        metalness: material.metalness,
        roughness: material.roughness,
        normalScaleX: material.normalScale.x,
        envMapIntensity: material.envMapIntensity,
      };
      const next = MATERIAL_PRESETS[presetIdx];
      tweenTo = {
        color: new THREE.Color(next.color),
        metalness: next.metalness,
        roughness: next.roughness,
        normalScaleX: next.normalScale,
        envMapIntensity: next.envMapIntensity,
      };
      tweenT0 = performance.now();
    }
    window.addEventListener('keydown', (e) => {
      if (e.key === 'm' || e.key === 'M') cyclePreset();
    });

    /* CRACK ANIMATION REMOVED. Code preserved as comments for future revival.
    // Approach: use a procedurally drawn jagged crack canvas as the LOGO
    // material's alphaMap, animating alphaTest from 0 → ~0.45 → 0 over the
    // cycle. When alphaTest rises, pixels darker than the threshold get
    // discarded from the logo — actual holes in the geometry. The crack
    // shape is in shape-bbox coords (matches our custom UVGenerator), so
    // it appears correctly placed on the logo. Side walls sample a single
    // pixel (always solid white in the canvas) so they stay intact.
    const CRACK_TEX_W = 1024;
    const CRACK_TEX_H = 512;

    function generateCrackCanvas() {
      const c = document.createElement('canvas');
      c.width = CRACK_TEX_W;
      c.height = CRACK_TEX_H;
      const ctx = c.getContext('2d');
      // WHITE background = solid logo
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, CRACK_TEX_W, CRACK_TEX_H);

      ctx.lineCap = 'butt';        // hard ends, not rounded — looks more like stone
      ctx.lineJoin = 'miter';
      ctx.miterLimit = 1.5;

      // Angular crack — many short straight segments at sharp angles.
      // (Midpoint displacement gave SMOOTH wavy lines that read like a
      // paper tear; stone cracks turn sharply, not in arcs.)
      function drawAngularCrack(x0, y0, dirAngle, totalLen, startWidth) {
        let cx = x0, cy = y0;
        let curAngle = dirAngle;
        let remaining = totalLen;
        let width = startWidth;
        ctx.strokeStyle = '#000';
        while (remaining > 4) {
          const segLen = 6 + Math.random() * 22;
          curAngle += (Math.random() - 0.5) * 0.9;  // SHARP angle change
          const nx = cx + Math.cos(curAngle) * segLen;
          const ny = cy + Math.sin(curAngle) * segLen;
          ctx.lineWidth = Math.max(1, width * (0.7 + Math.random() * 0.6)); // vary thickness
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(nx, ny);
          ctx.stroke();
          cx = nx; cy = ny;
          remaining -= segLen;
          width *= 0.985;  // taper toward the end
        }
        return [cx, cy];   // return endpoint for branches
      }

      // Spawn 6-10 cracks scattered across the canvas (NOT one big edge-to-edge).
      const CRACK_COUNT = 6 + Math.floor(Math.random() * 5);
      // Bias away from exact center (0.5, 0.5) so side walls stay solid
      function safePoint() {
        let x, y;
        do {
          x = 60 + Math.random() * (CRACK_TEX_W - 120);
          y = 30 + Math.random() * (CRACK_TEX_H - 60);
        } while (Math.abs(x - CRACK_TEX_W/2) < 80 && Math.abs(y - CRACK_TEX_H/2) < 40);
        return [x, y];
      }

      for (let i = 0; i < CRACK_COUNT; i++) {
        const [sx, sy] = safePoint();
        const angle = Math.random() * Math.PI * 2;
        const len = 60 + Math.random() * 180;
        const width = 2 + Math.random() * 3;
        const [ex, ey] = drawAngularCrack(sx, sy, angle, len, width);

        // Y-branch at the endpoint with ~50% chance
        if (Math.random() < 0.5) {
          const ba = angle + (Math.random() < 0.5 ? 0.6 : -0.6) + (Math.random() - 0.5) * 0.4;
          drawAngularCrack(ex, ey, ba, len * (0.4 + Math.random() * 0.4), width * 0.7);
        }
      }

      // Add a few small "spall" fragments — tiny dots/blobs scattered around
      // larger cracks that look like little pieces flaking off.
      ctx.fillStyle = '#000';
      for (let i = 0; i < 30; i++) {
        const [x, y] = safePoint();
        const r = 0.6 + Math.random() * 1.8;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      return c;
    }

    // Pre-build one CanvasTexture we'll mutate each cycle.
    const crackCanvas = generateCrackCanvas();
    const crackTexture = new THREE.CanvasTexture(crackCanvas);
    crackTexture.wrapS = crackTexture.wrapT = THREE.ClampToEdgeWrapping;
    crackTexture.flipY = false;   // our UVGenerator does 1-y flip on the front face already

    let crackState = 'idle';
    let crackT0 = 0;
    let nextCrackAt = performance.now() + 6000 + Math.random() * 4000;

    function setCrackActive(active) {
      // no-op (crack disabled)
    }
    */
    // crack disabled — no-op for animate loop:
    let crackState = 'disabled';

    // -- Ambient particles (atmospheric drift) --
    // 80 tiny white dots drifting slowly in the scene. Adds atmosphere
    // without competing with the logo for attention.
    const PARTICLE_COUNT = 80;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      // Spread across a volume in front of and behind the logo
      positions[i * 3]     = (Math.random() - 0.5) * 1600;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 900;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 400 - 100;
      // Very slow random velocity
      velocities[i * 3]     = (Math.random() - 0.5) * 0.25;
      velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.25;
      velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.10;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 2.5,
      transparent: true,
      opacity: 0.35,
      sizeAttenuation: true,
      depthWrite: false,
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Post-processing
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.1,   // strength — minimal
      0.6,   // radius
      0.92   // threshold — only brightest highlights
    );
    composer.addPass(bloomPass);

    // Chromatic aberration pass — intensity scales with rotation velocity.
    // R sampled with +offset, B with -offset, G centered. Subtle at rest,
    // visible during fast spin.
    const caPass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        amount: { value: 0.0 },  // updated each frame from rotation velocity
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float amount;
        varying vec2 vUv;
        void main() {
          // Direction radially outward from center (subtle)
          vec2 dir = (vUv - 0.5) * amount;
          float r = texture2D(tDiffuse, vUv + dir).r;
          float g = texture2D(tDiffuse, vUv).g;
          float b = texture2D(tDiffuse, vUv - dir).b;
          float a = texture2D(tDiffuse, vUv).a;
          gl_FragColor = vec4(r, g, b, a);
        }
      `,
    });
    composer.addPass(caPass);

    composer.addPass(new OutputPass());

    // Wheel + drag-driven endless rotation (no scrolling)
    let targetRot = 0;
    let currentRot = 0;
    const WHEEL_SENSITIVITY = 0.003;
    const DRAG_SENSITIVITY = 0.008;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetRot += e.deltaY * WHEEL_SENSITIVITY;
    }, { passive: false });

    let dragging = false;
    let dragStartX = 0;
    let dragStartRot = 0;
    let dragMoved = false;            // track if pointer actually moved during drag
    function startDrag(x) {
      dragging = true;
      dragMoved = false;
      dragStartX = x;
      dragStartRot = targetRot;
      document.body.classList.add('grabbing');
    }
    function moveDrag(x) {
      if (!dragging) return;
      if (Math.abs(x - dragStartX) > 5) dragMoved = true;
      targetRot = dragStartRot + (x - dragStartX) * DRAG_SENSITIVITY;
    }
    function endDrag() {
      // If we never moved more than 5px, treat as a CLICK → fast 720° auto-spin
      if (dragging && !dragMoved) {
        const start = targetRot;
        const end = targetRot + Math.PI * 4;
        const t0 = performance.now();
        const dur = 1200;
        function spin() {
          const t = (performance.now() - t0) / dur;
          if (t >= 1) { targetRot = end; return; }
          const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
          targetRot = start + (end - start) * eased;
          requestAnimationFrame(spin);
        }
        requestAnimationFrame(spin);
      }
      dragging = false;
      document.body.classList.remove('grabbing');
    }
    canvas.addEventListener('mousedown', (e) => startDrag(e.clientX));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchend', endDrag);

    // Mouse parallax (subtle scene tilt)
    let parallaxX = 0, parallaxY = 0;
    let parallaxTargetX = 0, parallaxTargetY = 0;
    window.addEventListener('mousemove', (e) => {
      if (dragging) return;
      parallaxTargetX = (e.clientX / window.innerWidth - 0.5) * 2;
      parallaxTargetY = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      const fovRad = camera.fov * Math.PI / 180;
      const visibleHeight = 2 * Math.tan(fovRad / 2) * camera.position.z;
      const visibleWidth = visibleHeight * camera.aspect;
      const target = Math.min(visibleWidth, visibleHeight) * 0.58;
      const bboxSize = bbox.getSize(new THREE.Vector3());
      const scale = Math.min(target / bboxSize.x, target / bboxSize.y);
      logoGroup.scale.setScalar(scale);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    let prevRot = 0;
    function animate() {
      const prev = currentRot;
      currentRot += (targetRot - currentRot) * 0.12;
      logoGroup.rotation.y = prefersReducedMotion ? 0 : currentRot;

      // Chromatic aberration intensity proportional to rotation velocity
      const rotVel = Math.abs(currentRot - prev);
      // Map velocity 0..0.2 rad/frame → CA amount 0..0.015
      const caAmount = Math.min(0.015, rotVel * 0.075);
      caPass.uniforms.amount.value = caAmount;

      // Material tween (M-key cycling)
      if (tweenTo && tweenFrom) {
        const t = Math.min(1, (performance.now() - tweenT0) / tweenDur);
        const k = t * t * (3 - 2 * t);  // smoothstep
        material.color.r = tweenFrom.color.r + (tweenTo.color.r - tweenFrom.color.r) * k;
        material.color.g = tweenFrom.color.g + (tweenTo.color.g - tweenFrom.color.g) * k;
        material.color.b = tweenFrom.color.b + (tweenTo.color.b - tweenFrom.color.b) * k;
        material.metalness = tweenFrom.metalness + (tweenTo.metalness - tweenFrom.metalness) * k;
        material.roughness = tweenFrom.roughness + (tweenTo.roughness - tweenFrom.roughness) * k;
        material.normalScale.set(
          tweenFrom.normalScaleX + (tweenTo.normalScaleX - tweenFrom.normalScaleX) * k,
          tweenFrom.normalScaleX + (tweenTo.normalScaleX - tweenFrom.normalScaleX) * k
        );
        material.envMapIntensity = tweenFrom.envMapIntensity + (tweenTo.envMapIntensity - tweenFrom.envMapIntensity) * k;
        if (t >= 1) { tweenFrom = null; tweenTo = null; }
      }

      // Crack animation removed.

      parallaxX += (parallaxTargetX - parallaxX) * 0.05;
      parallaxY += (parallaxTargetY - parallaxY) * 0.05;
      if (!prefersReducedMotion) {
        // Apply parallax to the OUTER parallaxGroup so it doesn't conflict
        // with the spin's rotation.y on logoGroup.
        parallaxGroup.rotation.x = parallaxY * 0.12;   // mouse up/down → logo tilts up/down
        parallaxGroup.rotation.y = parallaxX * 0.18;   // mouse left/right → logo tilts left/right
      }

      // Drift particles. Wrap them around when they leave the visible volume.
      if (!prefersReducedMotion) {
        const pos = particleGeo.attributes.position.array;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          pos[i * 3]     += velocities[i * 3];
          pos[i * 3 + 1] += velocities[i * 3 + 1];
          pos[i * 3 + 2] += velocities[i * 3 + 2];
          // Wrap on X
          if (pos[i * 3] > 800) pos[i * 3] = -800;
          else if (pos[i * 3] < -800) pos[i * 3] = 800;
          // Wrap on Y
          if (pos[i * 3 + 1] > 450) pos[i * 3 + 1] = -450;
          else if (pos[i * 3 + 1] < -450) pos[i * 3 + 1] = 450;
          // Wrap on Z
          if (pos[i * 3 + 2] > 200) pos[i * 3 + 2] = -300;
          else if (pos[i * 3 + 2] < -300) pos[i * 3 + 2] = 200;
        }
        particleGeo.attributes.position.needsUpdate = true;
      }

      composer.render();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
  <div id="variant-label" style="position:fixed;bottom:0.5rem;right:50%;transform:translateX(50%);font:10px ui-monospace,monospace;color:#fff;opacity:0.45;letter-spacing:0.15em;z-index:99;pointer-events:none">V3</div>
</body>
</html>
